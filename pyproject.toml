[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-learner"
version = "0.1.0"
description = "Local workflow observation, sequence learning, and guided automation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[project.scripts]
workflow-learner = "workflow_learner.__main__:main"

[tool.setuptools.package-data]
workflow_learner = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.packages.find]
include = ["workflow_learner*"]
