name: Verify Workflow Learner
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check workflow_learner tests scripts
      - run: ruff format --check workflow_learner tests scripts
      - run: python -m pytest -q
      - name: Check browser JavaScript
        run: |
          for file in extension/*.js workflow_learner/static/*.js; do node --check "$file"; done
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
